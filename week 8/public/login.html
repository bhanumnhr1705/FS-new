<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>User Login</h1>

    <nav>

        <a href="/">Home</a>

        <a href="/register">Register</a>

        <a href="/login">Login</a>

    </nav>

</header>

<div class="form-container">

    <h2>Login</h2>

    <form action="/login" method="POST">

        <label>Username:</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>

</div>

</body>

</html>
